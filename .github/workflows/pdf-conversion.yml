name: Convert Markdown to PDF

on:
  push:
    branches:
      - main
    paths:
      - 'CMUnity_Constitution.md'
  workflow_dispatch:

jobs:
  convert_to_pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Convert Markdown to PDF
        uses: baileyjm02/markdown-to-pdf@v1
        with:
          input_path: CMUnity_Constitution.md
          output_dir: pdfs

      - name: Verify PDF Generation
        run: |
          echo "Checking generated PDF..."
          ls -lh pdfs/
          if [ -f "pdfs/CMUnity_Constitution.pdf" ]; then
            echo "PDF exists. File size: $(ls -lh pdfs/CMUnity_Constitution.pdf | awk '{print $5}')"
            echo "Modification time: $(stat -c %y pdfs/CMUnity_Constitution.pdf)"
          else
            echo "ERROR: PDF was not generated!"
            exit 1
          fi

      - name: Commit and Push PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "dist: update constitution PDF [skip ci]"
          file_pattern: 'pdfs/*.pdf'
          branch: main
          skip_dirty_check: false
          # The permission block above 'contents: write' is still required
