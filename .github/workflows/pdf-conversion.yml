name: Convert Markdown to PDF

on:
  push:
    branches:
      - main
    paths:
      - 'CMUnity_Constitution.md'
  workflow_dispatch:

jobs:
  convert_to_pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Convert Markdown to PDF
        uses: baileyjm02/markdown-to-pdf@v1
        with:
          input_path: CMUnity_Constitution.md
          output_dir: pdfs
          # build_html is true by default, which is fine for simple MD

      - name: Commit PDF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          mkdir -p pdfs
          git add pdfs/*.pdf
          git commit -m "dist: update constitution PDF [skip ci]" || echo "No changes to commit"
          git push
