name: Convert Markdown to PDF

on:
  push:
    branches:
      - main
    paths:
      - "CMUnity_Constitution.md"
  workflow_dispatch:

jobs:
  convert_to_pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pandoc and weasyprint
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc python3 python3-pip
          pip3 install weasyprint

      - name: Debug - Verify Source Content
        run: |
          echo "Head commit: $(git rev-parse HEAD)"
          echo "First 20 lines of CMUnity_Constitution.md:"
          head -n 20 CMUnity_Constitution.md

      - name: Cleanup Old PDFs
        run: |
          if [ -d "pdfs" ]; then
            rm -f pdfs/*.pdf
          else
            mkdir -p pdfs
          fi

      - name: Convert Markdown to PDF
        run: |
          pandoc CMUnity_Constitution.md -o pdfs/CMUnity_Constitution.pdf --pdf-engine=weasyprint -V geometry:margin=1in --metadata title="CMUnity Constitution"

      - name: Verify PDF Generation
        run: |
          echo "Checking generated PDF..."
          ls -lh pdfs/
          if [ -f "pdfs/CMUnity_Constitution.pdf" ]; then
            echo "PDF exists."
            echo "Modification time: $(stat -c %y pdfs/CMUnity_Constitution.pdf)"
          else
            echo "ERROR: PDF was not generated!"
            exit 1
          fi

      - name: Commit and Push PDF
        id: commit_pdf
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "dist: update constitution PDF [skip ci]"
          file_pattern: "pdfs/*.pdf"
          branch: main
          skip_dirty_check: false
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com

      # Tell the website repo to pull the freshly-built PDF.
      # Skips silently until SITE_DISPATCH_TOKEN is configured, so this
      # never breaks PDF generation.
      - name: Notify cm-unity-site to sync
        if: steps.commit_pdf.outputs.changes_detected == 'true' && env.SITE_DISPATCH_TOKEN != ''
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            https://api.github.com/repos/RecursiveFunctions/cm-unity-site/dispatches \
            -d '{"event_type":"constitution-updated"}'
