name: Convert Markdown to PDF

on:
  push:
    branches:
      - main
    paths:
      - 'CMUnity_Constitution.md'
  workflow_dispatch:

jobs:
  convert_to_pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Convert Markdown to PDF
        uses: baileyjm02/markdown-to-pdf@v1
        with:
          input_path: CMUnity_Constitution.md
          output_dir: pdfs
          # build_html is true by default, which is fine for simple MD

      - name: Commit PDF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check if the PDF was actually generated
          if [ ! -f "pdfs/CMUnity_Constitution.pdf" ]; then
            echo "Error: PDF not found in pdfs/ directory"
            ls -R pdfs/ || echo "pdfs directory does not exist"
            exit 1
          fi
          
          git add pdfs/*.pdf
          
          # Only commit and push if there are changes
          if git diff --cached --quiet; then
            echo "No changes in PDF detected."
          else
            git commit -m "dist: update constitution PDF [skip ci]"
            git push origin main
          fi
